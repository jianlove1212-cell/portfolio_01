		.divwrap {

			margin: 0 auto;

		}

		.div1{width: 400px; height: 100px; background-color: antiquewhite; }
		.div2{width: 400px; height: 100px; background-color: #f5b662;}
		.div3{width: 400px; height: 100px; background-color: #ad680b;}
	</style>
</head>

<body>
	<div class="divwrap">
		<div class="div1">box1</div>
		<div class="div2">box2</div>
		<div class="div3">box3</div>
	</div>
